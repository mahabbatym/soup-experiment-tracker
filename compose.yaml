services:
  tracker:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_PATH: /data/tracker.sqlite3
    volumes:
      - tracker_data:/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
volumes:
  tracker_data:
